name: Calibration dashboard
on:
  pull_request:
    paths: ["CalibrationDashboard/**", ".github/workflows/dashboard.yml"]
  push:
    branches: [main]
    paths: ["CalibrationDashboard/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CalibrationDashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CalibrationDashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
