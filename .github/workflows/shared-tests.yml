name: Shared Swift tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check refresh coordination for data races
        timeout-minutes: 10
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: xcrun swift test -j 2 --sanitize=thread --filter TrackingRefreshRunnerTests
      - run: xcrun swift test
