name: Paired app smoke tests

on:
  pull_request:
    paths: &app_paths
      - Shared/**
      - iOS/**
      - watchOS/**
      - iOSWidgets/**
      - watchOSWidgets/**
      - ciggy/**
      - Configuration/**
      - Package.swift
      - Tools/Validation/check_ui_test_result.py
      - Tools/Validation/check_paired_crashes.py
      - .github/workflows/paired-apps.yml
  push:
    branches: [main]
    paths: *app_paths

permissions:
  contents: read

jobs:
  paired-apps:
    name: ${{ matrix.surface }} smoke tests
    strategy:
      fail-fast: false
      matrix:
        surface: [iPhone, Watch]
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the supported iPhone runtime
        if: matrix.surface == 'iPhone'
        run: |
          if ! xcrun simctl list runtimes -j | jq -e '.runtimes | any(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable)' >/dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.5 -architectureVariant arm64
          fi
          phone=$(xcrun simctl create "Ciggy iPhone" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "PHONE_ID=$phone" >> "$GITHUB_ENV"
      - name: Pair the Watch with its own companion iPhone
        if: matrix.surface == 'Watch'
        run: |
          phone=$(xcrun simctl create "Ciggy companion" com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          watch=$(xcrun simctl create "Ciggy Watch" com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Series-12-46mm com.apple.CoreSimulator.SimRuntime.watchOS-27-2)
          xcrun simctl pair "$watch" "$phone"
          echo "PHONE_ID=$phone" >> "$GITHUB_ENV"
          echo "WATCH_ID=$watch" >> "$GITHUB_ENV"
      - name: Verify consent and correction persistence on iPhone
        if: matrix.surface == 'iPhone'
        run: |
          xcodebuild -quiet -jobs 3 -project ciggy/ciggy.xcodeproj -scheme ciggy \
            -destination "platform=iOS Simulator,id=$PHONE_ID" build-for-testing
          xcrun simctl bootstatus "$PHONE_ID" -b
          xcodebuild -jobs 3 -project ciggy/ciggy.xcodeproj -scheme ciggy \
            -destination "platform=iOS Simulator,id=$PHONE_ID" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/phone.xcresult" \
            -only-testing:ciggyTests \
            -only-testing:ciggyUITests/ciggyUITests/testCalibrationRequiresExplicitConsentAndPairing \
            -only-testing:ciggyUITests/ciggyUITests/testHistoricalCorrectionPersistsAcrossRelaunch test-without-building
          python3 Tools/Validation/check_ui_test_result.py "$RUNNER_TEMP/phone.xcresult"
      - name: Log, undo and relaunch while the notification service is stalled
        if: matrix.surface == 'iPhone'
        timeout-minutes: 5
        run: |
          service=user/foreground/com.apple.usernotificationsd
          trap 'xcrun simctl spawn "$PHONE_ID" launchctl kill SIGCONT "$service"' EXIT
          xcrun simctl spawn "$PHONE_ID" launchctl kill SIGSTOP "$service"
          xcodebuild -jobs 3 -project ciggy/ciggy.xcodeproj -scheme ciggy \
            -destination "platform=iOS Simulator,id=$PHONE_ID" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/stalled-notifications.xcresult" \
            -only-testing:ciggyUITests/ciggyUITests/testPhoneLoggingAndUndo test-without-building
          python3 Tools/Validation/check_ui_test_result.py "$RUNNER_TEMP/stalled-notifications.xcresult"
      - name: Verify logging and relaunch on Watch
        id: watch_tests
        if: matrix.surface == 'Watch'
        run: |
          xcodebuild -quiet -jobs 3 -project ciggy/ciggy.xcodeproj -scheme 'ciggy Watch App' \
            -destination "platform=watchOS Simulator,id=$WATCH_ID" -derivedDataPath "$RUNNER_TEMP/watch-build" build-for-testing
          xcrun simctl bootstatus "$PHONE_ID" -b
          xcrun simctl bootstatus "$WATCH_ID" -b
          xcrun simctl install "$PHONE_ID" "$RUNNER_TEMP/watch-build/Build/Products/Debug-iphonesimulator/ciggy.app"
          xcrun simctl launch "$PHONE_ID" That-Canadian-Software-Services.ciggy
          xcodebuild -jobs 3 -project ciggy/ciggy.xcodeproj -scheme 'ciggy Watch App' \
            -destination "platform=watchOS Simulator,id=$WATCH_ID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/watch-build" -resultBundlePath "$RUNNER_TEMP/watch.xcresult" \
            '-only-testing:ciggy Watch AppTests' \
            '-only-testing:ciggy Watch AppUITests/ciggy_Watch_AppUITests/testSecondaryLoggingSavesOneEventAndSurvivesRelaunch' test-without-building
          python3 Tools/Validation/check_ui_test_result.py "$RUNNER_TEMP/watch.xcresult"
      - name: Check both devices for crash reports after Watch teardown
        id: crashes
        if: ${{ !cancelled() && matrix.surface == 'Watch' && env.WATCH_ID != '' }}
        run: python3 Tools/Validation/check_paired_crashes.py "$RUNNER_TEMP/paired-crashes" "$PHONE_ID" "$WATCH_ID"
      - name: Retain the Watch result, crash reports and matching debug binaries
        if: ${{ !cancelled() && (steps.watch_tests.outcome == 'failure' || steps.crashes.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: paired-simulator-crashes
          retention-days: 7
          path: |
            ${{ runner.temp }}/watch.xcresult
            ${{ runner.temp }}/paired-crashes/*.ips
            ${{ runner.temp }}/watch-build/Build/Products/Debug-iphonesimulator/ciggy.app/ciggy*
            ${{ runner.temp }}/watch-build/Build/Products/Debug-watchsimulator/ciggy Watch App.app/ciggy Watch App*
